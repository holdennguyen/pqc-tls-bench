# Digests pinned 2026-08-16 (docker inspect --format='{{index .RepoDigests 0}}')
# Every image's OpenSSL verified >= 3.5:
#   nginx:mainline 1.31.3 -> 3.5.6 | alpine/openssl -> 3.5.7 | postgres:18.6 -> 3.5.6
#   redis:8.10 (trixie, dynamic libssl) -> 3.5.x | node:25.9 bundled -> 3.5.5
#   python:3.14-slim-trixie -> 3.5.6
#
# MODE DESIGN (the experiment variable is the CLIENT's key-exchange group list):
#   - servers (PG, Redis, APIs, nginx edges) accept a superset of groups — identical
#     config for both modes.
#   - clients pick EXACTLY ONE group per mode (hybrid=X25519MLKEM768, classic=X25519):
#     nginx proxy via proxy_ssl_conf_command, Python via OPENSSL_CONF system_default,
#     Node via ecdhCurve. A successful handshake therefore PROVES the negotiated group.
#   - each API runs twice (…-hybrid / …-classic); the ONLY env difference is MODE.

x-api-common: &api-env
  POOL: "10"
  PGHOST: postgres
  PGUSER: postgres
  PGPASSWORD: bench
  PGDATABASE: postgres
  REDIS_HOST: redis
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

services:
  nginx-hybrid:
    image: nginx:mainline@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8  # nginx 1.31.3, OpenSSL 3.5.6
    volumes:
      - "./nginx/hybrid.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./certs:/certs:ro"
      - "./static:/static:ro"
      - "./results:/results:ro"
    ports: [ "8443:443" ]
  nginx-classic:
    image: nginx:mainline@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8
    volumes:
      - "./nginx/classic.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./certs:/certs:ro"
      - "./static:/static:ro"
      - "./results:/results:ro"
    ports: [ "8444:443" ]
  openssl-client:
    image: alpine/openssl:latest@sha256:47f40fac08a77cbdfb02444e543808aa36b9e31e21a261f4d94ffaf0c5c73832  # OpenSSL 3.5.7; used by make verify + probe
    entrypoint: [ "sleep", "infinity" ]
    volumes: [ "./certs:/certs:ro" ]

  api-python-hybrid: &api-python
    build: ./services/api-python
    environment:
      <<: *api-env
      MODE: hybrid
      OTEL_SERVICE_NAME: api-python-hybrid
    volumes: [ "./certs:/certs:ro" ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  api-python-classic:
    <<: *api-python
    environment:
      <<: *api-env
      MODE: classic
      OTEL_SERVICE_NAME: api-python-classic

  api-node-hybrid: &api-node
    build: ./services/api-node
    environment:
      <<: *api-env
      MODE: hybrid
      OTEL_SERVICE_NAME: api-node-hybrid
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes: [ "./certs:/certs:ro" ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  api-node-classic:
    <<: *api-node
    environment:
      <<: *api-env
      MODE: classic
      OTEL_SERVICE_NAME: api-node-classic
      NODE_EXTRA_CA_CERTS: /certs/server.crt

  postgres:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941  # 18.6 trixie, OpenSSL 3.5.6
    environment: [ "POSTGRES_PASSWORD=bench" ]
    volumes:
      - "./certs:/certs-src:ro"
      - "./db/init:/docker-entrypoint-initdb.d:ro"
    # key must be owned by postgres with 0600 — bind mounts carry host uid, so copy first
    entrypoint:
      - bash
      - -c
      - >
        install -o postgres -g postgres -m 600 /certs-src/server.key /var/lib/postgresql/server.key &&
        install -o postgres -g postgres -m 644 /certs-src/server.crt /var/lib/postgresql/server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_min_protocol_version=TLSv1.3
        -c ssl_groups=X25519MLKEM768:X25519
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:8@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366  # 8.10 trixie, OpenSSL 3.5.x
    volumes: [ "./certs:/certs-src:ro" ]
    # TLS-only (port 0). No group config -> OpenSSL 3.5 defaults (superset, both modes OK).
    entrypoint:
      - bash
      - -c
      - >
        mkdir -p /tls &&
        install -o redis -g redis -m 600 /certs-src/server.key /tls/server.key &&
        install -o redis -g redis -m 644 /certs-src/server.crt /tls/server.crt &&
        exec docker-entrypoint.sh redis-server
        --tls-port 6379 --port 0
        --tls-cert-file /tls/server.crt
        --tls-key-file /tls/server.key
        --tls-ca-cert-file /tls/server.crt
        --tls-auth-clients no
    healthcheck:
      test: [ "CMD", "redis-cli", "--tls", "--cacert", "/tls/server.crt", "-p", "6379", "ping" ]
      interval: 2s
      timeout: 2s
      retries: 15

  prometheus:
    image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # k6 pushes metrics here
    volumes: [ "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" ]
    ports: [ "9090:9090" ]
  grafana:
    image: grafana/grafana@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin   # local demo box only
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: [ "3000:3000" ]
    depends_on: [ prometheus ]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    privileged: true
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
  k6:
    profiles: [ "bench" ]   # docker compose --profile bench run --rm k6 run ...
    image: grafana/k6@sha256:5221b620a4f874faff6e32ba597aa667c058391fe4898b1c6f6377f062c6cdec  # go1.26 -> offers X25519MLKEM768 by default
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(50),p(95),p(99),avg
    volumes:
      - "./bench/k6:/scripts:ro"
      - "./results:/results"

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
    volumes: [ "./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro" ]
  jaeger:
    image: jaegertracing/all-in-one@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    ports: [ "16686:16686" ]

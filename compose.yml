# Digests pinned 2026-08-16 (docker inspect --format='{{index .RepoDigests 0}}')
# Requirement: every image's OpenSSL >= 3.5  (check: docker run --rm IMG openssl version)
# Day-1 services have no profile (start by default). Everything not yet built sits in
# the "full" profile: docker compose --profile full up -d --build   (Phase 3, Sun PM)
services:
  nginx-hybrid:
    image: nginx:mainline@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8  # nginx 1.31.3, OpenSSL 3.5.6
    volumes: [ "./nginx/hybrid.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/certs:ro" ]
    ports: [ "8443:443" ]
  nginx-classic:
    image: nginx:mainline@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8
    volumes: [ "./nginx/classic.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/certs:ro" ]
    ports: [ "8444:443" ]
  openssl-client:
    image: alpine/openssl:latest@sha256:47f40fac08a77cbdfb02444e543808aa36b9e31e21a261f4d94ffaf0c5c73832  # OpenSSL 3.5.7; used by make verify + probe
    entrypoint: [ "sleep", "infinity" ]
  api-python:
    profiles: [ "full" ]
    build: ./services/api-python
    environment: [ "POOL=10" ]
  api-node:
    profiles: [ "full" ]
    build: ./services/api-node
    environment: [ "POOL=10" ]
  postgres:
    profiles: [ "full" ]
    image: postgres:18      # trixie-based → OpenSSL 3.5; verify + pin
    environment: [ "POSTGRES_PASSWORD=bench" ]
    # TODO: ssl=on + certs via command/volume
  redis:
    profiles: [ "full" ]
    image: redis:8          # verify + pin; tls-port 6379, port 0
  # TODO(claude-code): k6, prometheus, grafana, cadvisor, tshark sidecar, netem variant
  otel-collector:
    profiles: [ "full" ]
    image: otel/opentelemetry-collector-contrib:latest  # pin digest
    volumes: [ "./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro" ]
  jaeger:
    profiles: [ "full" ]
    image: jaegertracing/all-in-one:latest              # pin digest
    ports: [ "16686:16686" ]

# HYBRID mode edge. The ONLY differences vs classic.conf are the group lists
# (ssl_ecdh_curve, proxy_ssl_conf_command Groups) and upstream instance names.
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.3;
    ssl_ecdh_curve      X25519MLKEM768:X25519;   # THE experiment variable (H1, server side)
    ssl_session_tickets off;                      # force full handshakes for churn tests

    # resolve at request time (Docker DNS) so nginx starts before the APIs exist
    resolver 127.0.0.11 valid=10s;
    set $py   https://api-python-hybrid:8000;
    set $node https://api-node-hybrid:8000;

    # H2 hops: proxy offers EXACTLY ONE group -> handshake success proves the group
    proxy_ssl_protocols TLSv1.3;
    proxy_ssl_conf_command Groups X25519MLKEM768;  # THE experiment variable (H2, client side)
    proxy_ssl_trusted_certificate /certs/server.crt;
    proxy_ssl_verify on;
    proxy_set_header X-TLS-Group $ssl_curve;

    location /health { return 200 "ok\n"; }
    location /py/   { rewrite ^/py/(.*)$ /$1 break;   proxy_pass $py; }
    location /node/ { rewrite ^/node/(.*)$ /$1 break; proxy_pass $node; }
    location /api/  { proxy_pass $py; }   # portal badge: /api/tls-info

    # UI layer (static, no build step)
    location = /     { root /static/portal; try_files /index.html =404; }
    # SPA (vite build artifact): unknown paths fall back to index.html (client router)
    location /app/   { root /static; index index.html; try_files $uri $uri/ /app/index.html; }
    location = /scan { default_type text/html; alias /results/scan.html; }
}

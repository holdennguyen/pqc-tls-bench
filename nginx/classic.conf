server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.3;
    ssl_ecdh_curve      X25519;   # THE experiment variable
    ssl_session_tickets off;                      # force full handshakes for churn tests
    location /health { return 200 "ok\n"; }
    location / {
        # resolve at request time (Docker DNS) so nginx starts before the APIs exist
        resolver 127.0.0.11 valid=10s;
        set $api https://api-python:8000;
        proxy_pass $api;                          # TODO: route /node -> api-node
        proxy_set_header X-TLS-Group $ssl_curve;
    }
}

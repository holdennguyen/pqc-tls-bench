# k6 results arrive via remote-write (see compose k6 env); cadvisor is scraped.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: prometheus
    static_configs: [ { targets: [ "localhost:9090" ] } ]
  - job_name: cadvisor
    static_configs: [ { targets: [ "cadvisor:8080" ] } ]
